name: Deploy production
# Manual only. Needs three repository secrets (docs/PRODUCTION.md §0):
#   SUPABASE_ACCESS_TOKEN, CLOUDFLARE_API_TOKEN, DF_OWNER_PASSWORD
# Optional: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID, ANTHROPIC_API_KEY.
# Everything else (project, database password, keys, function secrets, roles,
# schedule, studios, owners) is created or reused by scripts/prod/provision.ts.
on:
  workflow_dispatch:

concurrency: { group: production-deploy, cancel-in-progress: false }
permissions: { contents: read }

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DF_OWNER_PASSWORD: ${{ secrets.DF_OWNER_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      SMOKE_LABEL: production
      HAS_ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      HAS_TELEGRAM_CHECK: ${{ secrets.TELEGRAM_BOT_TOKEN != '' && secrets.TELEGRAM_CHAT_ID != '' }}
    steps:
      - name: Required secrets present
        run: |
          missing=""
          for name in SUPABASE_ACCESS_TOKEN CLOUDFLARE_API_TOKEN DF_OWNER_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: pnpm install --frozen-lockfile

      - name: Gate — typecheck, lint, unit tests, function type-check
        run: pnpm typecheck && pnpm lint && pnpm test && pnpm functions:check

      - name: Supabase project, Cloudflare Pages project, credentials
        run: pnpm -s tsx scripts/prod/provision.ts prepare

      - name: Database migrations
        run: |
          for i in 1 2 3 4 5 6; do
            pnpm -s db:migrate && exit 0
            echo "migrations attempt $i failed; the pooler may still be starting"; sleep 20
          done
          exit 1

      - name: Edge role, Auth settings, function secrets, dispatcher schedule
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: pnpm -s tsx scripts/prod/provision.ts configure

      - name: Edge Functions
        id: functions
        run: |
          pnpm -s functions:vendor
          for fn in public-api owner-api assistant notify-dispatcher; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api
          done

      - name: Studios (GRAPHITE, ICE LAB) and their owners
        env: { DF_SYNC_OWNER_PASSWORDS: '1' }
        run: pnpm -s tenant:seed graphite ice-lab

      - name: Frontend — production build (https API enforced) + secret scan
        run: pnpm build:prod

      - name: Cloudflare Pages deploy
        id: pages
        run: pnpm exec wrangler pages deploy apps/web/dist --project-name "$CF_PAGES_PROJECT" --branch main --commit-dirty=true

      - name: Wait until the app and the API answer
        run: |
          for i in $(seq 1 30); do
            app=$(curl -s -o /dev/null -w '%{http_code}' "$PROD_APP_URL/s/graphite") || app=000
            api=$(curl -s -o /dev/null -w '%{http_code}' -H "apikey: $PROD_SUPABASE_PUBLISHABLE_KEY" "$PROD_SUPABASE_URL/functions/v1/public-api/storefront/graphite") || api=000
            echo "app $app, api $api"
            [ "$app" = 200 ] && [ "$api" = 200 ] && exit 0
            sleep 10
          done
          exit 1

      - name: Verify database invariants
        id: verify
        run: pnpm prod:verify-db

      - run: pnpm exec playwright install --with-deps chromium
        if: ${{ !cancelled() && steps.pages.outcome == 'success' }}
      - name: Production smoke (GRAPHITE flow + ICE LAB isolation)
        if: ${{ !cancelled() && steps.pages.outcome == 'success' }}
        run: pnpm test:prod

      - name: Claude live smoke through the deployed assistant
        if: ${{ !cancelled() && steps.functions.outcome == 'success' && env.HAS_ANTHROPIC == 'true' }}
        run: pnpm prod:ai-smoke

      - name: Telegram live delivery
        if: ${{ !cancelled() && env.HAS_TELEGRAM_CHECK == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: pnpm prod:telegram-check

      - name: Summary
        if: always()
        run: |
          {
            echo "### DETAILFLOW production"
            echo "- Public: ${PROD_APP_URL:-not deployed}/s/graphite/"
            echo "- Owner: ${PROD_APP_URL:-not deployed}/s/graphite/owner/"
            echo "- API: ${PROD_SUPABASE_URL:-not deployed}"
          } >> "$GITHUB_STEP_SUMMARY"

      # The repository is public: results are uploaded only after checking that no secret value is inside.
      - name: Check smoke results for secrets
        if: always()
        id: clean
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const names = ["SUPABASE_ACCESS_TOKEN","CLOUDFLARE_API_TOKEN","DF_OWNER_PASSWORD","SUPABASE_SERVICE_ROLE_KEY","DATABASE_URL","DF_DB_URL","DF_EDGE_PASSWORD","DF_MANAGE_TOKEN_SECRET","DF_DISPATCHER_SECRET","PROD_ICE_OWNER_PASSWORD"];
            const values = names.map((n) => process.env[n]).filter((v) => v && v.length >= 8);
            const dir = "docs/smoke";
            const files = fs.existsSync(dir) ? fs.readdirSync(dir).map((f) => path.join(dir, f)) : [];
            const bad = files.filter((f) => values.some((v) => fs.readFileSync(f, "utf8").includes(v)));
            if (bad.length) { console.log("secret found in", bad.length, "file(s); not uploading"); process.exit(1); }
            console.log("clean:", files.length, "file(s)");
          '
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.clean.outcome == 'success' }}
        with: { name: production-smoke, path: 'docs/smoke/', retention-days: 30 }
